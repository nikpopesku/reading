services:
  web:
    container_name: reading-web
    build: .
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
      - media:/app/media
      - venv:/app/.venv
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: readingorion.a007.bid,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://readingorion.a007.bid,http://localhost,http://127.0.0.1
      DATABASE_URL: ${DATABASE_URL:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.reading-orion.loadbalancer.server.port=8000"
      - "traefik.http.routers.reading-orion-http.rule=Host(`readingorion.a007.bid`)"
      - "traefik.http.routers.reading-orion-http.entrypoints=web"
      - "traefik.http.routers.reading-orion-http.service=reading-orion"
      - "traefik.http.routers.reading-orion.rule=Host(`readingorion.a007.bid`)"
      - "traefik.http.routers.reading-orion.entrypoints=https"
      - "traefik.http.routers.reading-orion.service=reading-orion"
      - "traefik.http.routers.reading-orion.tls=true"
      - "traefik.http.routers.reading-orion-local.rule=Host(`localhost`) || Host(`127.0.0.1`)"
      - "traefik.http.routers.reading-orion-local.entrypoints=web"
      - "traefik.http.routers.reading-orion-local.service=reading-orion-local"
      - "traefik.http.services.reading-orion-local.loadbalancer.server.port=8000"
    networks:
      - default
      - traefik
      - postgres

volumes:
  media:
  venv:

networks:
  traefik:
    external: true
  postgres:
    external: true
