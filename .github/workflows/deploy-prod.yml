name: Deploy Production

# RD-32: prod is released only from a `v*` git tag on master
# (`git tag -a vYYYY.MM.DD.N -m "RD-x, RD-y" origin/master && git push origin <tag>`).
# workflow_dispatch redeploys an existing tag; `rollback` allows one older than what is live.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. v2026.10.30.1)'
        required: true
        type: string
      rollback:
        description: 'Allow deploying a tag older than the one live on prod'
        required: false
        type: boolean
        default: false

# One prod deploy at a time, queued in order; never cancel a running deploy
# (it may be mid-migration or mid `docker stack deploy`).
concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guard:
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      live_sha: ${{ steps.live.outputs.sha }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        run: |
          git fetch --force --tags origin
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}") || { echo "::error::Tag $TAG not found"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$TAG -> $SHA"

      - name: Tag must be on master
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/master \
            || { echo "::error::$TAG ($SHA) is not on master. Only tag merged commits."; exit 1; }

      # The live release is the tag in reading_web's image (reading-web:<tag>@sha256:...).
      # Deploys before RD-32 used prod-<sha>, which carries the commit directly.
      - name: Tag must be newer than what is live
        id: live
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          ROLLBACK: ${{ inputs.rollback || false }}
          SSH_KEY: ${{ secrets.TITAN_SSH_KEY }}
          TITAN_HOST: ${{ secrets.TITAN_HOST }}
          TITAN_USER: ${{ secrets.TITAN_USER }}
        run: |
          install -m 600 /dev/null ~/ssh_key && printf '%s\n' "$SSH_KEY" > ~/ssh_key
          IMAGE=$(ssh -i ~/ssh_key -o StrictHostKeyChecking=accept-new "$TITAN_USER@$TITAN_HOST" \
            "docker service inspect reading_web --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'" || true)
          rm -f ~/ssh_key
          LIVE_TAG=$(printf '%s' "${IMAGE%@*}" | sed -n 's/.*:\([^:]*\)$/\1/p')
          DEPLOYED=""
          case "$LIVE_TAG" in
            v*) DEPLOYED=$(git rev-parse --verify -q "refs/tags/$LIVE_TAG^{commit}" || true) ;;
            prod-*) DEPLOYED=$(git rev-parse --verify -q "${LIVE_TAG#prod-}^{commit}" || true) ;;
          esac
          echo "Live: ${IMAGE:-unknown} (${DEPLOYED:-unknown}), deploying: $TAG ($SHA)"
          echo "sha=$DEPLOYED" >> "$GITHUB_OUTPUT"

          if [ -z "$DEPLOYED" ] || ! git merge-base --is-ancestor "$DEPLOYED" origin/master 2>/dev/null; then
            echo "::warning::Live release ${LIVE_TAG:-unknown} is not a commit on master; skipping the ordering check."
          elif [ "$DEPLOYED" = "$SHA" ]; then
            echo "Redeploying the live commit."
          elif git merge-base --is-ancestor "$DEPLOYED" "$SHA"; then
            echo "$TAG is newer than what is live."
          elif [ "$ROLLBACK" = "true" ]; then
            echo "::warning::Rolling back from $LIVE_TAG to $TAG."
          else
            echo "::error::$TAG is older than what is live ($LIVE_TAG). Re-run via workflow_dispatch with rollback=true to roll back."
            exit 1
          fi

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: guard
    environment: prod
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ inputs.tag || github.ref_name }}
      PROD_DB_NAME: reading
      PROD_DB_USER: reading
      DJANGO_SECRET_KEY_SECRET_NAME: reading_django_secret_key_${{ github.run_id }}_${{ github.run_attempt }}
      DATABASE_URL_SECRET_NAME: reading_database_url_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nikpopesku/reading-web:latest
            ghcr.io/nikpopesku/reading-web:${{ env.IMAGE_TAG }}

      - name: Encode production secrets for SSH
        shell: bash
        env:
          PROD_DJANGO_SECRET_KEY: ${{ secrets.PROD_DJANGO_SECRET_KEY }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          require_secret() {
            if [ -z "${!1}" ]; then
              echo "::error::Missing required prod environment secret: $1"
              exit 1
            fi
          }
          encode_env() {
            printf '%s=%s\n' "$1" "$(printf '%s' "$2" | base64 -w0)" >> "$GITHUB_ENV"
          }
          require_secret PROD_DJANGO_SECRET_KEY
          require_secret PROD_DATABASE_URL
          require_secret PROD_DB_PASSWORD
          encode_env PROD_DJANGO_SECRET_KEY_B64 "$PROD_DJANGO_SECRET_KEY"
          encode_env PROD_DATABASE_URL_B64 "$PROD_DATABASE_URL"
          encode_env PROD_DB_PASSWORD_B64 "$PROD_DB_PASSWORD"

      - name: Copy stack file to Titan
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.TITAN_HOST }}
          username: ${{ secrets.TITAN_USER }}
          key: ${{ secrets.TITAN_SSH_KEY }}
          source: docker-stack.prod.yml
          target: /home/spacer/reading
          strip_components: 0

      - name: Deploy to Titan (prod)
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          PROD_DB_NAME: ${{ env.PROD_DB_NAME }}
          PROD_DB_USER: ${{ env.PROD_DB_USER }}
          PROD_DB_PASSWORD_B64: ${{ env.PROD_DB_PASSWORD_B64 }}
          PROD_DJANGO_SECRET_KEY_B64: ${{ env.PROD_DJANGO_SECRET_KEY_B64 }}
          PROD_DATABASE_URL_B64: ${{ env.PROD_DATABASE_URL_B64 }}
          DJANGO_SECRET_KEY_SECRET_NAME: ${{ env.DJANGO_SECRET_KEY_SECRET_NAME }}
          DATABASE_URL_SECRET_NAME: ${{ env.DATABASE_URL_SECRET_NAME }}
        with:
          host: ${{ secrets.TITAN_HOST }}
          username: ${{ secrets.TITAN_USER }}
          key: ${{ secrets.TITAN_SSH_KEY }}
          envs: IMAGE_TAG,PROD_DB_NAME,PROD_DB_USER,PROD_DB_PASSWORD_B64,PROD_DJANGO_SECRET_KEY_B64,PROD_DATABASE_URL_B64,DJANGO_SECRET_KEY_SECRET_NAME,DATABASE_URL_SECRET_NAME
          script: |
            set -eu
            mkdir -p /home/spacer/reading
            decode() { printf '%s' "$1" | base64 -d; }
            create_secret() {
              name="$1"
              value_b64="$2"
              if docker secret inspect "$name" >/dev/null 2>&1; then
                return
              fi
              decode "$value_b64" | docker secret create --label app=reading --label environment=prod "$name" -
            }

            PROD_DB_PASSWORD="$(decode "$PROD_DB_PASSWORD_B64")"
            postgres_uid="$(getent passwd postgres | cut -d: -f3)"
            docker run --rm -i \
              --user "$postgres_uid" \
              -v /var/run/postgresql:/var/run/postgresql \
              postgres:17-alpine \
              psql -h /var/run/postgresql -U postgres -d postgres \
              -v ON_ERROR_STOP=1 \
              -v db_name="$PROD_DB_NAME" \
              -v db_user="$PROD_DB_USER" \
              -v db_password="$PROD_DB_PASSWORD" <<'SQL'
            SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'db_user', :'db_password')
            WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'db_user')
            \gexec
            ALTER ROLE :"db_user" WITH PASSWORD :'db_password';
            SELECT format('CREATE DATABASE %I OWNER %I', :'db_name', :'db_user')
            WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'db_name')
            \gexec
            SQL

            create_secret "$DJANGO_SECRET_KEY_SECRET_NAME" "$PROD_DJANGO_SECRET_KEY_B64"
            create_secret "$DATABASE_URL_SECRET_NAME" "$PROD_DATABASE_URL_B64"

            docker pull "ghcr.io/nikpopesku/reading-web:$IMAGE_TAG"
            cd /home/spacer/reading
            IMAGE_TAG="$IMAGE_TAG" \
              DJANGO_SECRET_KEY_SECRET_NAME="$DJANGO_SECRET_KEY_SECRET_NAME" \
              DATABASE_URL_SECRET_NAME="$DATABASE_URL_SECRET_NAME" \
              docker stack deploy --detach=true -c docker-stack.prod.yml reading --with-registry-auth

            web_container=""
            for attempt in $(seq 1 30); do
              for container in $(docker ps -q -f label=com.docker.swarm.service.name=reading_web); do
                container_image="$(docker inspect --format '{{.Config.Image}}' "$container")"
                if [ "${container_image#ghcr.io/nikpopesku/reading-web:$IMAGE_TAG}" != "$container_image" ]; then
                  web_container="$container"
                  break
                fi
              done
              [ -n "$web_container" ] && break
              sleep 2
            done

            if [ -z "${web_container:-}" ]; then
              docker service ps reading_web --no-trunc
              exit 1
            fi

            docker exec "$web_container" python manage.py migrate --noinput
            docker service ls --filter label=com.docker.stack.namespace=reading

  release:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists (redeploy/rollback)."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi

  notify:
    runs-on: ubuntu-latest
    needs:
      - guard
      - release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Notify Slack
        env:
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          SHA: ${{ needs.guard.outputs.sha }}
          LIVE_SHA: ${{ needs.guard.outputs.live_sha }}
        run: |
          if [ -z "$SLACK_DEPLOY_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_DEPLOY_WEBHOOK_URL is not set; skipping the Slack notification."
            exit 0
          fi
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

          if [ -n "$LIVE_SHA" ] && git merge-base --is-ancestor "$LIVE_SHA" "$SHA" 2>/dev/null; then
            RANGE="$LIVE_SHA..$SHA"; ACTION="deployed to prod"; BULLET="•"
          elif [ -n "$LIVE_SHA" ] && git merge-base --is-ancestor "$SHA" "$LIVE_SHA" 2>/dev/null; then
            RANGE="$SHA..$LIVE_SHA"; ACTION="rolled back on prod, reverting"; BULLET="↩"
          else
            # Live commit unknown: fall back to the previous release tag.
            PREV=$(git describe --tags --abbrev=0 --match 'v*' "$SHA^" 2>/dev/null || true)
            RANGE="${PREV:+$PREV..}$SHA"; ACTION="deployed to prod"; BULLET="•"
            [ -n "$PREV" ] || RANGE="-1 $SHA"
          fi

          # One line per commit: escape Slack control chars, link ticket keys to Jira and (#n) to the PR.
          # shellcheck disable=SC2086
          CHANGES=$(git log --no-merges --format='%s' $RANGE \
            | sed -E -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
                  -e 's#\b(RD|PE)-[0-9]+\b#<https://885nik.atlassian.net/browse/&|&>#g' \
                  -e "s#\(\#([0-9]+)\)#(<$REPO_URL/pull/\1|\#\1>)#" \
                  -e "s/^/$BULLET /")
          [ -n "$CHANGES" ] || CHANGES="_No new commits (redeploy)._"
          TOTAL=$(printf '%s\n' "$CHANGES" | wc -l)
          if [ "$TOTAL" -gt 30 ]; then
            CHANGES="$(printf '%s\n' "$CHANGES" | head -30)"$'\n'"_…and $((TOTAL - 30)) more_"
          fi

          RUN="<$REPO_URL/actions/runs/$GITHUB_RUN_ID|run>"
          HEADER=":rocket: *${GITHUB_REPOSITORY#*/}* <$REPO_URL/releases/tag/$TAG|$TAG> $ACTION ($RUN)"
          printf '%s\n%s\n' "$HEADER" "$CHANGES"
          jq -n --arg text "$HEADER"$'\n'"$CHANGES" '{text: $text}' \
            | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' \
                --data @- "$SLACK_DEPLOY_WEBHOOK_URL"
